          https://www.gstatic.com 
          https://firebase.googleapis.com

          https://apis.google.com 
          https://*.firebaseio.com

        style-src 'self' 
          https://fonts.googleapis.com 
          https://embed.tawk.to

          https://fonts.gstatic.com 
          https://embed.tawk.to;
          
        img-src 'self'

        connect-src 'self' 
          http://localhost:5000

          wss://localhost:5000

          https://*.firebaseio.com 
          wss://*.firebaseio.com 
          https://*.googleapis.com 
          wss://*.googleapis.com
          https://openrouter.ai
          https://res.cloudinary.com;
          
        frame-src 'self' 
          https://*.tawk.to 
          https://www.google.com 
          https://*.firebaseio.com;
          
        worker-src 'self' 
          blob: 
          https://lts-admission.vercel.app;
          
        manifest-src 'self';
        
        form-action 'self' 
          http://localhost:5000;

  <!-- Preconnect for performance -->

  <title>Literacy Tree School - Online Admission Portal</title>

  <!-- Production Analytics - Replace GA_MEASUREMENT_ID with your actual ID -->
  <% if (process.env.NODE_ENV==='production' ) { %>
    <script src="https://www.googletagmanager.com/gtag/js?id=GA_MEASUREMENT_ID" async></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'GA_MEASUREMENT_ID');
    </script>
  <% } %>

  <style>
    body {
      background-color: #2c5e3a;
      margin: 0;
      font-family: 'Open Sans', sans-serif;
    }

    .noscript-warning {
      background: white;
      color: #333;
      padding: 2rem;
      max-width: 800px;
      margin: 2rem auto;
      border-radius: 8px;
      text-align: center;
    }

    /* Font declaration */
    @font-face {
      font-family: 'Schoolbell';
      src: url('/fonts/Schoolbell-Regular.woff2') format('woff2'),
           url('/fonts/Schoolbell-Regular.woff') format('woff'),
           url('/fonts/Schoolbell-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
  </style>
</head>

<body>
  <noscript>
    <div class="noscript-warning">
      <h1>JavaScript Required</h1>
      <p>
        The Literacy Tree School admission form requires JavaScript to function properly.
        Please enable JavaScript in your browser settings or contact our admissions team
        at peggynanfukwe@gmail.com for assistance.
      </p>
    </div>
  </noscript>
  <div id="root"></div>

  <!-- Preload font -->
  <link rel="preload" href="/fonts/Schoolbell-Regular.woff2" as="font" type="font/woff2" crossorigin>
  
  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <!-- Firebase SDK - Local Files -->
  <script src="/firebase-app-compat.js"></script>
  <script src="/firebase-database-compat.js"></script>
  
  <!-- Service Worker Registration -->
  <script>
    // Register service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(registration => {
            console.log('SW registered: ', registration);
          })
          .catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }
  </script>
  
  <script>
      // Initialize particles.js after the DOM is loaded
      document.addEventListener('DOMContentLoaded', function() {
        if (typeof particlesJS === 'function') {
          particlesJS('particles-js', {
            particles: {
              number: { value: 30, density: { enable: true, value_area: 800 } },
              color: { value: "#ffffff" },
              shape: { type: "circle" },
              opacity: { value: 0.1, random: true },
              size: { value: 3, random: true },
              line_linked: {
                enable: true,
                distance: 150,
                color: "#ffffff",
                opacity: 0.05,
                width: 1
              },
              move: {
                enable: true,
                speed: 1,
                direction: "none",
                random: true,
                straight: false,
                out_mode: "out",
                bounce: false
              }
            },
            interactivity: {
              detect_on: "canvas",
              events: {
                onhover: { enable: true, mode: "repulse" },
                onclick: { enable: true, mode: "push" },
                resize: true
              }
            },
            retina_detect: true
          });
        }
        
        // Count-up animation for stats
        const counters = document.querySelectorAll('.count-up');
        const speed = 200;
        
        counters.forEach(counter => {
          const updateCount = () => {
            const target = +counter.getAttribute('data-target');
            const count = +counter.innerText;
            
            const inc = target / speed;
            
            if (count < target) {
              counter.innerText = Math.ceil(count + inc);
              setTimeout(updateCount, 20);
            } else {
              counter.innerText = target;
            }
          };
          
          updateCount();
        });
      });
  </script>
</body>
</html>
